<div class="restaurant-insert-wrapper">
  <!-- Back to button -->
  <button type="button" mat-stroked-button color="primary">
    <mat-icon>west</mat-icon> Back
  </button>
  <app-main-content-header
    [headingFontSize]="64"
    [title]="title"
    [description]="description"
  ></app-main-content-header>
</div>

<!-- Restaurant form -->
<app-restaurant-form *ngIf="isInsertMode"></app-restaurant-form>

<app-restaurant-form
  *ngIf="isEditMode && initialData"
  [restaurantDetails]="initialData"
  [isEditMode]="isEditMode"
></app-restaurant-form>
