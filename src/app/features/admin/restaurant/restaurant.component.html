<app-main-content-header
  headingType="heading-large"
  [title]="pageTitle"
  [description]="pageDescription"
>
  <a [routerLink]="'/' + addRestaurantRoute" mat-flat-button color="primary">
    <mat-icon>add</mat-icon>
    ADD RESTAURANT
  </a>
</app-main-content-header>

<app-card [hasShadow]="true">
  <app-table
    [dataSource]="restaurantData"
    [columns]="columns"
    (tableAction)="handleTableAction($event)"
  >
  </app-table>
</app-card>
