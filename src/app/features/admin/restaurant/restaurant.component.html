<app-main-content-header
  headingType="large"
  [title]="pageTitle"
  [description]="pageDescription"
>
  <a [routerLink]="'/' + addRestaurantRoute" mat-flat-button color="primary">
    <mat-icon>add</mat-icon>
    ADD RESTAURANT
  </a>
</app-main-content-header>

<div class="restaurant-list">
  <app-card [hasShadow]="true">
    <app-table [dataSource]="restaurantData" [columns]="columns"> </app-table>
  </app-card>
</div>
