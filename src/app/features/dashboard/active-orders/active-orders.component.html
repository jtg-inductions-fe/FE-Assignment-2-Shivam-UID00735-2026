<app-card [hasShadow]="true">
  <app-main-content-header
    headingType="heading-medium"
    title="Active Orders"
    description="Manage pending and accepted orders directly from your dashboard."
  >
  </app-main-content-header>

  <app-table
    [dataSource]="activeOrdersItem"
    [columns]="activeOrderColumn"
    (tableAction)="handleTableAction($event)"
    [enablePagination]="false"
  >
  </app-table>
</app-card>
