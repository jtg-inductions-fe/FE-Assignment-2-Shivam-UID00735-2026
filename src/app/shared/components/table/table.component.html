<table mat-table [dataSource]="tableDataSource">
  <ng-container *ngFor="let column of columns" [matColumnDef]="column.key">
    <th mat-header-cell *matHeaderCellDef class="table__data">
      {{ column.header }}
    </th>

    <td mat-cell *matCellDef="let row" class="table__data">
      <ng-container *ngIf="column.type === 'template'; else textCell">
        <ng-container
          *ngTemplateOutlet="templates[column.key]; context: { $implicit: row }"
        >
        </ng-container>
      </ng-container>

      <ng-template #textCell>
        {{ row[column.key] }}
      </ng-template>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayColumn"></tr>
  <tr mat-row *matRowDef="let row; columns: displayColumn"></tr>
</table>

<mat-paginator
  *ngIf="enablePagination"
  [pageSize]="10"
  [pageSizeOptions]="[5, 10, 20]"
  showFirstLastButtons
>
</mat-paginator>
