<ng-container *ngIf="item.role.includes(userRole)">
  <mat-tree
    [dataSource]="dataSource"
    [treeControl]="treeControl"
    class="sidebar-tree"
  >
    <mat-tree-node
      *matTreeNodeDef="let node"
      matTreeNodePadding
      class="sidebar-tree-node"
    >
      <a
        [routerLink]="node.href"
        routerLinkActive="active-class"
        mat-list-item
        class="sidebar-item__link"
      >
        <mat-icon
          class="sidebar-item__icon"
          *ngIf="node.icon; else emptyIcon"
          matListItemIcon
        >
          {{ node.icon || 'help' }}
        </mat-icon>

        <ng-template #emptyIcon>
          <mat-icon class="sidebar-item__icon" matListItemIcon> </mat-icon>
        </ng-template>

        <span matListItemTitle>{{ node.title }}</span>
        <span matListItemMeta class="badge" *ngIf="node.haveUpdate">{{
          node.haveUpdate
        }}</span>
      </a>
    </mat-tree-node>

    <mat-nested-tree-node
      *matTreeNodeDef="let node; when: hasChild"
      class="sidebar-item__toggle-menu"
    >
      <div
        class="sidebar-item__toggle-link"
        matTreeNodeToggle
        matTreeNodePadding
      >
        <a
          class="sidebar-item__link-title"
          [routerLink]="node.href"
          routerLinkActive="active-class"
        >
          <mat-icon
            class="sidebar-item__icon"
            *ngIf="node.icon"
            matListItemIcon
            >{{ node.icon }}</mat-icon
          >
          <span class="sidebar-item__menu-name" matListItemTitle>{{
            node.title
          }}</span>
        </a>
        <button type="button" mat-icon-button>
          <mat-icon class="mat-icon-rtl-mirror">
            {{
              treeControl.isExpanded(node)
                ? 'keyboard_arrow_up'
                : 'keyboard_arrow_down'
            }}
          </mat-icon>
        </button>
      </div>

      <div
        class="sidebar-item__children"
        [class.sidebar-tree-invisible]="!treeControl.isExpanded(node)"
        role="group"
      >
        <ng-container matTreeNodeOutlet></ng-container>
      </div>
    </mat-nested-tree-node>
  </mat-tree>
</ng-container>
