<ng-container *ngIf="item.role.includes(userRole)" class="sidebar-item">
  <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="">
    <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
      <a [routerLink]="node.href" routerLinkActive="active-class" mat-list-item>
        <mat-icon
          class="sidebar-item__icon"
          *ngIf="node.icon"
          matListItemIcon
          >{{ node.icon ? node.icon : 'help' }}</mat-icon
        >
        <span matListItemTitle>{{ node.title }}</span>
      </a>
    </mat-tree-node>

    <mat-nested-tree-node
      *matTreeNodeDef="let node; when: hasChild"
      class="sidebar-item__toggle-menu"
      matTreeNodePadding
    >
      <div class="sidebar-item__toggle-link">
        <!-- sidebar item link -->
        <a
          class="sidebar-item__link-title"
          [routerLink]="node.href"
          routerLinkActive="active-class"
        >
          <mat-icon class="sidebar-item__icon" matListItemIcon>{{
            node.icon
          }}</mat-icon>
          <span class="sidebar-item__menu-name" matListItemTitle>{{
            node.title
          }}</span>
        </a>
        <button type="button" mat-icon-button matTreeNodeToggle>
          <mat-icon class="mat-icon-rtl-mirror">
            {{
              treeControl.isExpanded(node)
                ? 'keyboard_arrow_up'
                : 'keyboard_arrow_down'
            }}
          </mat-icon>
        </button>
      </div>
      <div
        class="sidebar-item__children"
        [hidden]="!treeControl.isExpanded(node)"
      >
        <ng-container matTreeNodeOutlet></ng-container>
      </div>
    </mat-nested-tree-node>
  </mat-tree>
</ng-container>
