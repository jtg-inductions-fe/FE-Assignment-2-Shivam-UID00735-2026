<app-card [hasBorder]="true">
  <div class="stat-card">
    <div class="stat-card__data">
      <div class="stat-card__title">{{ title }}</div>
      <h3 class="stat-card__stats">
        {{ isCurrency ? (stat | currency) : stat }}
      </h3>
    </div>
    <div [class]="'stat-card__icon stat-card__icon--' + itemClassName">
      <mat-icon>{{ icon }}</mat-icon>
    </div>
  </div>
</app-card>
