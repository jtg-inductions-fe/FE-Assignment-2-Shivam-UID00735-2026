<div class="main-header">
  <div class="main-header__overview">
    <h1 class="main-header__heading" [style.font-size]="getHeadingSize()">
      {{ title }}
    </h1>
    <p class="main-header__description">
      {{ description }}
    </p>
  </div>
  <div class="main-header__actions">
    <ng-content *ngIf="showRestaurantFilter()"></ng-content>
  </div>
</div>
